<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="room" x2="0" y2="1"><stop stop-color="#202b33"/><stop offset=".55" stop-color="#121a20"/><stop offset="1" stop-color="#090b0d"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#263c49"/><stop offset=".6" stop-color="#101b25"/><stop offset="1" stop-color="#0b1118"/></linearGradient>
 <linearGradient id="lamp" x2="0" y2="1"><stop stop-color="#e2ad70" stop-opacity=".32"/><stop offset="1" stop-color="#e2ad70" stop-opacity="0"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#5a4030"/><stop offset=".12" stop-color="#2b211b"/><stop offset="1" stop-color="#0a0908"/></linearGradient>
 <radialGradient id="warm"><stop stop-color="#d79a5d" stop-opacity=".48"/><stop offset="1" stop-color="#d79a5d" stop-opacity="0"/></radialGradient>
 <radialGradient id="vignette"><stop offset=".4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".78"/></radialGradient>
